name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Check imports and syntax
        run: python -m compileall -q . -x '(^|/)(\.venv|\.git|\.beads|__pycache__)(/|$)'
      - name: Dependency consistency
        run: python -m pip check
      - name: Run test suite
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v
      - name: Scan tracked files for bot-token URLs
        run: |
          if git grep -nE 'api\.telegram\.org/file/bot[0-9]+:' -- ':!tests'; then
            echo 'Token-bearing Telegram file URL found.' >&2
            exit 1
          fi
