name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install --require-hashes -r requirements-linux.txt
      - name: Check imports and syntax
        run: python -m compileall -q . -x '(^|/)(\.venv|\.git|\.beads|__pycache__)(/|$)'
      - name: Dependency consistency
        run: python -m pip check
      - name: Run test suite
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v
      - name: Scan tracked files for bot-token URLs
        run: |
          if git grep -nE 'api\.telegram\.org/file/bot[0-9]+:' -- ':!tests'; then
            echo 'Token-bearing Telegram file URL found.' >&2
            exit 1
          fi

  release-gate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify deterministic source artifact
        shell: bash
        run: |
          output_directory="$RUNNER_TEMP/bookapp-release"
          release_id="ci-${GITHUB_SHA::12}"
          source_date_epoch="$(git log -1 --format=%ct)"
          mkdir "$output_directory"
          python deploy/release.py build \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-directory "$output_directory" \
            --release-id "$release_id" \
            --source-date-epoch "$source_date_epoch" \
            --require-clean-tree
          python deploy/release.py verify \
            --repo-root "$GITHUB_WORKSPACE" \
            --artifact "$output_directory/bookapp-${release_id}.tar.gz"

  linux-readiness:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install --require-hashes -r requirements-linux.txt
      - name: Check deployment script syntax
        run: |
          bash -n deploy/bootstrap-managed-platform.sh
          bash -n deploy/verify-managed-platform.sh
          bash -n deploy/generate-requirements-lock.sh
      - name: Run Linux-only readiness tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest \
            tests.test_linux_socket_acceptance \
            tests.test_managed_platform_assets \
            tests.test_deploy_verification -v
      - name: Check dependency consistency
        run: python -m pip check
      # This job intentionally does not run bootstrap, systemd, setfacl, Caddy, or SSH.
